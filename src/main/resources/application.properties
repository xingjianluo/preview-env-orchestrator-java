# Default per-tenant environment quota
orchestrator.quota.default=2

# Idle lease thresholds (deterministic in tests; reaper disabled by default)
orchestrator.lease.enabled=false
orchestrator.lease.interval-millis=5000
orchestrator.lease.idle-stop-millis=30000
orchestrator.lease.idle-destroy-millis=60000

spring.main.banner-mode=off
